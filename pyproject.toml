[project]
name = "coverage-agent"
version = "0.1.0"
description = "Raise a Python repo's test coverage until a target is hit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hudsonlatimer", email = "hudsonlatimer97@gmail.com" }]
keywords = ["langgraph", "coverage", "testing", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.3.0",
    "langchain-together>=0.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-ollama>=0.3.0",
    "pydantic>=2",
    "python-dotenv>=1.0.0",
    "coverage>=7.6",
    "pytest>=8.0",
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
]

[project.optional-dependencies]
dev = ["ruff>=0.12"]

[project.urls]
Homepage = "https://github.com/Hudsonlatimer/Self-improving-coding-agent"
Repository = "https://github.com/Hudsonlatimer/Self-improving-coding-agent"
Issues = "https://github.com/Hudsonlatimer/Self-improving-coding-agent/issues"

[project.scripts]
coverage-agent = "coverage_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverage_agent"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: calls a real model provider and spends quota"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv]
package = true
